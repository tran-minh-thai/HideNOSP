# The 9-row protocol table (design doc section 11.7, rule 2.6.1).
# Rule 2.6.2: fill it in at the first draft, not at submission time.
#
# State on 2026-09-12: the rows that BLOCK SC3 are locked together with
# config/preregistration.md. The rows that only block submission (measuring machine, JVM flags,
# memory measurement, time limit, warm-up) are still null; they do not block running SC3 to SC5
# and SC7, because those scenarios give numbers that do not depend on the machine. SC6 is blocked.
#
# A null cell means NOT LOCKED YET, not "does not apply".
# The grounds for every value: config/de_xuat_gia_tri_nhom_A.md

row_1_thresholds_and_scope:
  # The range of sigma, l_max, [g-, g+] and |S| for EVERY dataset.
  common_to_every_dataset:
    l_max: 4                          # raised from 3; design doc section 11.5 draws sensitive
                                      # patterns of length 2-4, and l_max = 3 left the patterns
                                      # of length 4 outside F_sigma. Measured cost: cheap on all
                                      # six datasets, fifa takes only 0.6 seconds more.
    sensitive_pattern_length: [2, 4]
    sensitive_size: [1, 5, 10, 20]    # design doc section 11.5
    sensitive_sets_per_cell: 20       # design doc section 11.5; an upper limit, see
                                      # preregistration.md section 9
    sampling_percentiles: [10, 30, 50, 70, 90]   # five sup_NO percentiles, 4 sets each -> 20
    sampling_method: >
      Five equal-rank strata of the candidates sorted by sup_NO, centred on these percentiles;
      up to 4 distinct sets per stratum, never a repeated set (hidenosp.exp.SensitiveSampling,
      preregistration.md section 9, added 2026-09-25 before any SC3 run for the paper).
    common_gaps: ["[0,1]", "[0,3]"]
  per_dataset:
    dna_mt745584:
      sigma: [2500, 4000]
      gaps: ["[0,1]", "[0,3]", "[0,10]"]
      note: >
        sigma must be 2500 or more. With |Sigma| = 4 and l_max = 3 the pattern space holds only
        4 + 16 + 64 = 84 patterns, and at sigma = 1000 all 84 are frequent, i.e. F_sigma is the
        WHOLE pattern space: Ghost can then never be nonzero and Lost loses its comparative
        meaning. At sigma = 2500, |F_sigma| = 51 out of 84, a proper subset.
    msnbc:
      sigma: [1000, 2000, 5000]
      gaps: ["[0,1]", "[0,3]", "[0,10]"]
    leviathan: {sigma: [500], gaps: ["[0,1]", "[0,3]"]}
    bible:     {sigma: [2000], gaps: ["[0,1]", "[0,3]"]}
    sign:      {sigma: [200], gaps: ["[0,1]", "[0,3]"]}
    bms1:      {sigma: [100], gaps: ["[0,1]", "[0,3]"]}
    fifa:      {sigma: [3000], gaps: ["[0,1]", "[0,3]"]}
    # Added 2026-09-25 (event logs, tools/build_datasets.py). Sigma picked by sigma_rule:
    # |F_sigma| within [50, 700] at both gaps. Group still to be fixed by the official SC2 run on
    # the measuring machine, with the thresholds of preregistration.md section 3, before any SC3.
    bpi2013:   {sigma: [500, 1000], gaps: ["[0,1]", "[0,3]"]}
    bpi2012:   {sigma: [2000, 4000], gaps: ["[0,1]", "[0,3]"]}
    sepsis:    {sigma: [300], gaps: ["[0,1]", "[0,3]"]}
    # Added 2026-09-25: protein files SDB4 and SDB1 of NTP-Miner (tools/build_datasets.py). The
    # two share 64-75% of their sequences (exact match), so they are one source of data; which of
    # them enters H2 is still open, to be fixed in config/preregistration.md before any SC3 run on
    # protein. Sigma fixed before any SC2 run on them: the smallest and the largest sigma of the
    # grid 300..1200 that meet the rule below at both gaps (scenario SIGMA; table 2 of
    # results-probe/protein_groups_and_sigma_rule_probe_20260925.md).
    protein_sdb4: {sigma: [500, 900], gaps: ["[0,1]", "[0,3]"]}
    protein_sdb1: {sigma: [400, 800], gaps: ["[0,1]", "[0,3]"]}
    synthetic: {sigma: null, gaps: null}
  # Preregistration section 11 (2026-09-26): the repeated-item scope uses the same configurations
  # (sigma, gaps) as above, minus SIGN and BMS1, which have no repeated-item pattern of length 2 to 4
  # in F_sigma, plus dna sigma 4000 [0,1], which has two repeated-item candidates and no distinct one.
  repeated_item_scope:
    sc2: "--profile=repeated"                 # groups over the repeated-item pool
    group_table: "config/configuration_groups_repeated.tsv"   # locked from the official SC2 runs
    sc3: "--patternKind=repeated"             # sensitive sets drawn from that pool (section 9 rule)
    method_H2R: "cut-hide-rw-ls"              # section 12 (was "cut-hide", section 11 point 4); the
                                              # same method is tested in H2;
                                              # tools/preregistered_analysis.py must agree
    report_only: ["protein_sdb1"]             # section 11, point 5
    pareto_front: "--pareto=true --methods=none with --sensitiveSize=1"   # section 11, point 6, descriptive;
                                              # a batch of its own since section 14 (2026-10-02)
  sigma_rule: >
    Keep |F_sigma| within [50, 700] AND F_sigma must be a PROPER subset of the space of patterns
    of length up to l_max. Every sigma above meets it.
  # CORRECTION 2026-09-25. The last sentence above is false at l_max = 4. The rule applied by a
  # program (scenario SIGMA, commit a548e53; results-probe/protein_groups_and_sigma_rule_probe_
  # 20260925.md, table 2) puts six of the fifteen dna_mt745584 and msnbc configurations outside
  # [50, 700]: dna [0,1] sigma 2500 and 4000, dna [0,3] sigma 4000 (too few patterns), msnbc [0,3]
  # sigma 1000, msnbc [0,10] sigma 1000 and 2000 (too many). Every other sigma above meets the
  # rule at every gap it is used with. The dna and msnbc values were fixed on 2026-09-12 by the
  # preregistration and are kept; the rule binds the datasets added after that date. What the six
  # cells change: the three dna cells have |F_sigma| of 6 to 16, so Lost_rel moves in coarse steps
  # there and must be read with its denominator; the three msnbc cells only cost more time.
  note: >
    sigma is declared both as an absolute number and as a share of the total sup_NO (design doc
    section 11.5). Whether the share or the absolute number is kept when comparing subsets is NOT
    LOCKED YET; it blocks submission, not SC3.

row_2_epsilon_of_B_eps:
  value: 0.5                          # for EVERY dataset
  required_check: "B_eps must not be empty; if it is, report an error, never carry on silently"
  basis: >
    |B_eps| measured on nine configurations. epsilon = 0.10 gives an EMPTY B_eps on dna [0,3]
    sigma=1000; step 4 then gives every position the weight 0 and CUT-HIDE silently falls back to
    the uniform-weight variant, i.e. the variant compared against in SC7 would be the very variant
    running. epsilon = 1.00 pulls 24-54% of F_sigma into the band, the weight
    1/(sup - sigma + 1) is then almost uniform, and "patterns near the threshold" loses its
    meaning. epsilon = 0.50 gives |B_eps| from 6 to 248, never empty on any configuration measured.

row_3_seeds:
  sensitive_set_sampling: 2026
  synthetic_data_generation: 2026
  randomized_methods: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
  randomized_methods_aggregation: "median of the 10 runs"
  genetic_algorithm: "uses the same 10 seeds as above"
  note: >
    HH, HR, RH, RR and GA run 10 times because these are quantities that do not depend on the
    machine; the repetition table of design doc section 11.6 is for timing only. The variation
    observed in RR is large (|R| = 31 and 151 on two sensitive sets of one configuration).

row_4_synthetic_data_parameters:
  item_distribution: "uniform over the alphabet"
  alphabet_size: null
  sequence_count: null
  sequence_length: null
  target_rho_rep: null
  target_beta: null
  note: >
    NOT LOCKED YET; it blocks submission, not SC3. Report only the MEASURED rho_rep and beta
    (SyntheticGenerator.measure), never the target values as if they had been reached.

row_5_run_environment:
  jdk: "Eclipse Temurin 25 (LTS)"   # bytecode target 25 in pom.xml; tools/run.py refuses any
                                    # other Java major version for runs that go into the paper.
                                    # The exact update (25.0.x) is stamped into every result file.
  xms_flag: null
  xmx_flag: null
  jdk_exact: "Eclipse Temurin 25.0.4.1+1"   # winget EclipseAdoptium.Temurin.25.JDK --version 25.0.4.101;
                                    # the same build as the previous machine. tools/campaign.py locks the
                                    # runtime version and vendor and refuses a run on any other.
  operating_system: "Windows 11"    # measuring machine, separate from the development machine
  # From 2026-11-01 (preregistration section 18) the measuring machine is a Dell XPS with 64 GB,
  # declared by the author. Its host name, processor and memory are written by the machine itself
  # into results-invariant/campaign_<host name>/ENV_LOCK.json at the first step of its campaign, and
  # into the header of every result file; the three fields below are filled from that file.
  cpu: null
  ram: null
  machine_name: null
  previous_machine:                 # every official SC1, SC2 and SC3 number up to 2026-10-12
    machine_name: "DESKTOP-L8A6EPO"
    cpu: "Intel(R) Core(TM) i7-6560U CPU @ 2.20GHz, 4 logical processors"
    ram: "16597393408 bytes"
    jdk: "25.0.4.1"
    role: >
      Kept in the repository as the reproduction check of preregistration section 18: every count
      column of a row that is not OT or OOM must equal the row of the new machine. Its rows do not
      enter the tables of the paper.
  # An earlier version of this row named an AMD Ryzen 9 9950X with 64 GB, a machine that never ran
  # anything for this project; that entry was an assumption and is withdrawn.
  note: "NOT LOCKED YET. Blocks SC6, not SC3 to SC5 and SC7."

row_6_memory_measurement:
  method: "heap in use, sampled from inside the process (util.MemoryProbe)"
  sampling_period_ms: 50
  resident_memory: null
  note: >
    Design doc section 11.7 asks for the peak RSS of the process. The JVM does not report RSS, so
    it takes a wrapper script, which does not exist yet (TODO in util.MemoryProbe). A table that
    prints memory must say whether it prints heap or RSS. NOT LOCKED YET, blocks SC6.

row_7_time_limit:
  limit_per_run_seconds: 1800   # wall clock, one method on one sensitive set (preregistration
                                # section 14); SC3 --timeLimit=1800. Counted from the call of the
                                # method to its sanitization; evaluating it and the Pareto front
                                # are not counted.
  mechanism: >
    cooperative check (hidenosp.util.Deadline) when a Nettree is built, a position is masked, at
    each phase of a max flow, each position of the exact program and each pass of the local search;
    tested by Sc3TimeLimitTest
  heap_for_sc3: "-Xmx8g"        # OOM depends on it, so it is part of the cell
  heap_for_sc3_pareto_front: "-Xmx32g"   # preregistration section 18: the Pareto-front batch only
                                # (--methods=none, descriptive); every method batch keeps -Xmx8g
  timeout_code: "OT"     # rule 3.3.14
  out_of_memory_code: "OOM"
  when_exceeded: >
    drop the pair from Wilcoxon, count it and report it apart (preregistration section 5)
  max_dropped_share: 0.10     # more than 10% of the instances dropped: no conclusion on H2
  note: >
    Locked on 2026-10-02 for SC3. Which rows are OT depends on the machine and OOM on the heap, so the
    official SC3 runs carry --machine of row 5 and the count of OT and OOM rows is reported with them.

row_8_repetitions_and_aggregation:
  under_1_second: 15
  from_1_to_10_seconds: 10
  from_10_to_120_seconds: 5
  over_120_seconds: 3
  aggregation: "mean ± standard deviation; wall-clock time and CPU time measured side by side"
  note: >
    util.Timing.repetitionsFor implements this table (design doc section 11.6). It applies to
    TIMING only; the reruns of the randomized methods that measure invariant quantities are in
    row 3.

row_9_warmup_procedure:
  warmup_runs: null
  note: "NOT LOCKED YET, blocks SC6. util.Timing.measure takes the number of warm-up runs."

# Beyond the 9 rows: the implementation decisions that must be declared (section 7 of RUNBOOK.md).
implementation_decisions:
  mu_P_scope: 1
  weight_scale: 1000000        # CostCurve.SCALE
  S_plus_relation: "subsequence over the item sequence"
  prefix_pruning_when_mining: true
  mask_semantics: "-1, matches no item"
  itemset_linearisation: >
    sorted by ascending item code; the share of positions affected is recorded next to the dataset
  node_weight_when_mu_above_1: >
    every node of a position is given the weight of that position; an implementation choice
  small_instances:
    max_candidate_positions: 64    # IlpExact.MAX_CANDIDATES
    max_masks: 12                  # IlpExact.MAX_MASKS
  SC3_optimum_reference: "exact-minR-minLost"
  several_patterns_under_database_threshold: >
    Linear-programming rounding is the main option (it guarantees a factor of l_max); the hybrid
    GA is the fallback. If neither is ready in time, narrow the scope to |S| = 1 and say so, rather
    than bring the GA in with parameters not locked yet.
  code_version: >
    HIDENOSP_REVISION = git rev-parse HEAD, set by a wrapper script before Runner is called.
    MANDATORY for every run whose numbers go into the paper. The existing numbers, whose first line
    says "unversioned", are kept as probe numbers.
