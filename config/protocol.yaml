# Protocol table: every value that affects a reported number.
# The thresholds and tests of the hypotheses are in config/preregistration.md.

row_1_thresholds_and_scope:
  common_to_every_dataset:
    l_max: 4                          # longest pattern counted in F_sigma(D)
    sensitive_pattern_length: [2, 4]
    sensitive_size: [1, 5, 10, 20]
    sensitive_sets_per_cell: 20       # upper limit; see preregistration.md section 9
    sampling_percentiles: [10, 30, 50, 70, 90]   # five sup_NO percentiles, 4 sets each -> 20
    sampling_method: >
      Five equal-rank strata of the candidates sorted by sup_NO, centred on these percentiles;
      up to 4 distinct sets per stratum, never a repeated set (hidenosp.exp.SensitiveSampling).
    common_gaps: ["[0,1]", "[0,3]"]
  per_dataset:
    dna_mt745584:
      sigma: [2500, 4000]
      gaps: ["[0,1]", "[0,3]", "[0,10]"]
      note: >
        sigma is 2500 or more: with |Sigma| = 4 the pattern space is small, and at sigma = 1000 every
        pattern is frequent, so F_sigma would be the whole space and Ghost could never be nonzero.
    msnbc:
      sigma: [1000, 2000, 5000]
      gaps: ["[0,1]", "[0,3]", "[0,10]"]
    leviathan: {sigma: [500], gaps: ["[0,1]", "[0,3]"]}
    bible:     {sigma: [2000], gaps: ["[0,1]", "[0,3]"]}
    sign:      {sigma: [200], gaps: ["[0,1]", "[0,3]"]}
    bms1:      {sigma: [100], gaps: ["[0,1]", "[0,3]"]}
    fifa:      {sigma: [3000], gaps: ["[0,1]", "[0,3]"]}
    bpi2013:   {sigma: [500, 1000], gaps: ["[0,1]", "[0,3]"]}
    bpi2012:   {sigma: [2000, 4000], gaps: ["[0,1]", "[0,3]"]}
    sepsis:    {sigma: [300], gaps: ["[0,1]", "[0,3]"]}
    protein_sdb4: {sigma: [500, 900], gaps: ["[0,1]", "[0,3]"]}
    protein_sdb1: {sigma: [400, 800], gaps: ["[0,1]", "[0,3]"]}
  # The repeated-item scope uses the same configurations, minus SIGN and BMS1 (no repeated-item
  # pattern of length 2 to 4 in F_sigma), plus dna sigma 4000 [0,1].
  repeated_item_scope:
    sc2: "--profile=repeated"                 # groups over the repeated-item pool
    group_table: "config/configuration_groups_repeated.tsv"
    sc3: "--patternKind=repeated"             # sensitive sets drawn from that pool
    method_H2R: "cut-hide-rw-ls"              # method under test of H2 and H2-R;
                                              # tools/preregistered_analysis.py must agree
    report_only: ["protein_sdb1"]             # reported, never in a test (shares most sequences
                                              # with protein_sdb4)
  sigma_rule: >
    Keep |F_sigma| within [50, 700] and F_sigma a proper subset of the space of patterns of length up
    to l_max (scenario SIGMA applies it). Six dna_mt745584 and msnbc configurations lie outside
    [50, 700]: dna [0,1] sigma 2500 and 4000 and dna [0,3] sigma 4000 (6 to 16 patterns, so Lost_rel
    moves in coarse steps there), msnbc [0,3] sigma 1000 and msnbc [0,10] sigma 1000 and 2000.

row_2_epsilon_of_B_eps:
  value: 0.5                          # every dataset
  required_check: "B_eps must not be empty when it is supplied; an empty supplied band is an error"
  basis: >
    epsilon = 0.10 leaves B_eps empty on some configurations, so every vital-node weight would be 0;
    epsilon = 1.00 puts 24-54% of F_sigma in the band and the weight 1/(sup - sigma + 1) becomes
    almost uniform; epsilon = 0.50 gives |B_eps| from 6 to 248 on the configurations measured.
  empty_computed_band: >
    On small instances the computed band can be empty. CutHide.forBand then uses uniform weights, which
    is exact there (every vital-node weight would be 0), and names that configuration in the method
    column (preregistration section 19.2).

row_3_seeds:
  sensitive_set_sampling: 2026
  synthetic_data_generation: 2026
  randomized_methods: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
  randomized_methods_aggregation: "median of the 10 runs"
  note: >
    Every method reported in the paper is deterministic; the seeds above apply to the random
    controls (HH, HR, RH, RR) and the genetic algorithm, which the paper does not report.

row_4_synthetic_data_parameters:
  item_distribution: "uniform over the alphabet"
  note: >
    The synthetic generator (io.SyntheticGenerator) is used by tests and probe runs only; no reported
    number comes from synthetic data.

row_5_run_environment:
  jdk: "Eclipse Temurin 25.0.4.1+1"   # bytecode target 25 in pom.xml; tools/run.py refuses any
                                      # other major version for runs whose numbers are reported
  operating_system: "Windows 11"
  cpu: "Intel(R) Core(TM) i7-10750H CPU @ 2.60GHz, 12 logical processors"
  ram: "68452814848 bytes"
  machine_name: "ADMIN-PC"            # the measuring machine; see results-invariant/campaign_ADMIN-PC/ENV_LOCK.json
  reproduction_machine:
    machine_name: "DESKTOP-L8A6EPO"
    cpu: "Intel(R) Core(TM) i7-6560U CPU @ 2.20GHz, 4 logical processors"
    ram: "16597393408 bytes"
    jdk: "25.0.4.1"
    role: >
      Its result files are kept as a reproduction check: every count column of a row that is not OT or
      OOM equals the row of the measuring machine. They do not enter the tables of the paper.

row_6_memory_measurement:
  method: "heap in use, sampled from inside the process every 50 ms (util.MemoryProbe)"
  note: >
    The paper reports no memory figure: sampling every 50 ms cannot catch the peak of runs shorter
    than a second.

row_7_time_limit:
  limit_per_run_seconds: 1800   # wall clock, one method on one sensitive set (SC3 --timeLimit=1800),
                                # from the call of the method to its sanitization
  mechanism: >
    cooperative check (hidenosp.util.Deadline) when a Nettree is built, a position is masked, at each
    phase of a max flow, each position of the exact program and each pass of the local search;
    tested by Sc3TimeLimitTest
  heap_for_sc3: "-Xmx8g"        # OOM depends on it, so it is part of the cell
  heap_for_sc3_pareto_front: "-Xmx32g"   # the descriptive Pareto-front batch (--methods=none)
  timeout_code: "OT"
  out_of_memory_code: "OOM"
  when_exceeded: "drop the pair from the Wilcoxon test, count it and report it apart"
  max_dropped_share: 0.10       # more than 10% of the instances dropped: no conclusion on H2

row_8_repetitions_and_aggregation:
  under_1_second: 15
  from_1_to_10_seconds: 10
  from_10_to_120_seconds: 5
  over_120_seconds: 3
  aggregation: "mean and standard deviation; wall-clock time and CPU time measured side by side"
  note: "util.Timing.repetitionsFor implements this table; it applies to timing only."

row_9_warmup_procedure:
  warmup_runs: 1
  note: >
    One warm-up run per method and instance, then one run that sets the number of repetitions of
    row 8 (also discarded), then the repetitions (util.Timing.measure). SC6 times the mining of
    F_sigma(D) once per cell as its own row; the methods receive F_sigma(D) from outside their clocks.

implementation_decisions:
  mu_P_scope: 1
  weight_scale: 1000000        # CostCurve.SCALE
  S_plus_relation: >
    "necessary" from 2026-11-08 (preregistration section 21): the sensitive patterns and the frequent patterns
    that contain one of them as a block of consecutive items when g+ is finite, as a subsequence when g+ is
    unbounded; under HIDE-SEQ the sensitive patterns alone. Files written before 2026-11-08 used
    "subsequence over the item sequence" for every gap; they carry no "# closure" header line.
  prefix_pruning_when_mining: true
  mask_semantics: "-1, matches no item"
  itemset_linearisation: >
    sorted by ascending item code; the share of positions affected is recorded next to the dataset
  node_weight_when_mu_above_1: "every node of a position is given the weight of that position"
  small_instances:
    max_candidate_positions: 64    # IlpExact.MAX_CANDIDATES
    max_masks: 12                  # IlpExact.MAX_MASKS
  SC3_optimum_reference: "exact-minR-minLost"
  several_sensitive_patterns: "greedy rule of CutHide, optionally followed by the refinement (cut-hide-refine)"
  code_version: >
    HIDENOSP_REVISION = git rev-parse HEAD, set by tools/run.py before Runner is called; every result
    file records it in its name and header.
