# Ô nào mã tự sinh được thì đã có sẵn ở đầu mỗi tệp kết quả; chép từ đó sang.
# Ô để trống có nghĩa là CHƯA CHỐT, không phải là không áp dụng.

dong_1_nguong_va_pham_vi:
  # Dải sigma, l_max, [g-, g+] và |S| cho TỪNG bộ dữ liệu.
  mac_dinh_ma:
    l_max: 3
    gap: "[0, 3]"
    sensitive_size: [1, 5, 10, 20]   # §11.5
    sensitive_sets_moi_o: 20         # §11.5
  theo_bo:
    msnbc:     {sigma: null, l_max: null, gap: null, sensitive_size: null}
    fifa:      {sigma: null, l_max: null, gap: null, sensitive_size: null}
    sign:      {sigma: null, l_max: null, gap: null, sensitive_size: null}
    dna:       {sigma: null, l_max: null, gap: null, sensitive_size: null}
    bms_web_1: {sigma: null, l_max: null, gap: null, sensitive_size: null}
    kosarak:   {sigma: null, l_max: null, gap: null, sensitive_size: null}
    trucks:    {sigma: null, l_max: null, gap: null, sensitive_size: null}
    tong_hop:  {sigma: null, l_max: null, gap: null, sensitive_size: null}
  ghi_chu: >
    sigma khai cả dạng tuyệt đối lẫn tỉ lệ theo tổng sup_NO (§11.5). SC6 quyết định giữ tỉ lệ
    hay giữ tuyệt đối, và bài phải nói rõ.

